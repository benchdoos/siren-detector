name: "🐛 Bug report · English"
description: Report something that isn't working as expected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Siren Detector. Share only what’s relevant; logs or screenshots are always helpful."
  - type: textarea
    id: problem
    attributes:
      label: "🐛 What happened?"
      placeholder: Describe the issue...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "🔁 Steps to reproduce"
      description: What did you do before the issue appeared?
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "✅ What did you expect to happen?"
      placeholder: Describe the expected behavior...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "🧩 Environment"
      description: Include relevant versions, hardware, and operating system.
      placeholder: "e.g. ESP32, firmware v1.2, Ubuntu 24.04"
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: "📎 Logs or screenshots"
      description: Paste logs or attach screenshots, if available.
    validations:
      required: false
