<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siren Detector</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; }
  header { padding: 16px 24px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 18px; font-weight: 600; }
  #status { font-size: 12px; padding: 3px 8px; border-radius: 4px; background: #333; color: #888; }
  #status.connected { background: #1a3a1a; color: #4caf50; }

  .score-panel { padding: 20px 24px; border-bottom: 1px solid #222; }
  .score-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .score-bar-wrap { background: #1a1a1a; border-radius: 6px; height: 28px; overflow: hidden; position: relative; }
  .score-bar { height: 100%; width: 0%; background: #4caf50; transition: width .3s, background .3s; border-radius: 6px; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.5 } }
  .score-bar.pulsing { animation: pulse .8s ease-in-out infinite; }
  .score-value { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 600; }
  .state-badge { display: inline-block; margin-top: 8px; font-size: 12px; padding: 2px 10px; border-radius: 4px; background: #222; color: #888; }
  .state-badge.possible  { background: #3a2a00; color: #ffa726; }
  .state-badge.confirmed { background: #3a0000; color: #ef5350; }
  .score-breakdown { font-size: 11px; color: #555; margin-top: 6px; min-height: 1em; }

  .events-header { padding: 12px 24px 8px; font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: .08em; display: flex; justify-content: space-between; align-items: center; }
  .events-header button { font-size: 11px; background: none; border: 1px solid #333; color: #555; padding: 2px 8px; border-radius: 4px; cursor: pointer; }
  .events-header button:hover { color: #aaa; border-color: #555; }
  .events-count { font-variant-numeric: tabular-nums; color: #666; }
  .batch-bar { padding: 0 24px 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; display: none; }
  .batch-bar.visible { display: flex; }
  .batch-bar span { font-size: 11px; color: #888; }
  .batch-bar .lbtn { font-size: 11px; }
  .event-card .ev-check { margin-right: 8px; accent-color: #4caf50; cursor: pointer; }
  .filter-bar { padding: 0 24px 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .fbtn { font-size: 11px; padding: 3px 10px; border-radius: 4px; border: 1px solid #333; background: none; color: #666; cursor: pointer; }
  .fbtn:hover { color: #aaa; border-color: #555; }
  .fbtn.active { background: #222; border-color: #888; color: #e0e0e0; }

  #events { padding: 0 24px 24px; display: flex; flex-direction: column; gap: 10px; }
  .event-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 14px 16px; }
  .event-card.confirmed { border-color: #5a1a1a; }
  .event-card.possible  { border-color: #3a2a00; }
  .event-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
  .badge.confirmed { background: #5a1a1a; color: #ef5350; }
  .badge.possible  { background: #3a2a00; color: #ffa726; }
  .event-time { font-size: 12px; color: #666; }
  .event-conf { font-size: 12px; color: #888; }
  .event-engine { font-size: 11px; color: #444; }
  .event-breakdown { font-size: 11px; color: #555; margin-bottom: 8px; }
  audio { width: 100%; height: 32px; filter: invert(1) hue-rotate(180deg) brightness(0.8); }
  .no-clip { font-size: 12px; color: #444; font-style: italic; }
  .empty { text-align: center; padding: 40px; color: #444; font-size: 14px; }
  .label-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .label-row span { font-size: 11px; color: #555; }
  .lbtn { font-size: 11px; padding: 3px 10px; border-radius: 4px; border: 1px solid #333; background: none; color: #888; cursor: pointer; }
  .lbtn:hover { border-color: #666; color: #ccc; }
  .lbtn.active { background: #1a3a1a; border-color: #4caf50; color: #4caf50; cursor: default; }
  .lbtn.siren { border-color: #5a1a1a; color: #ef5350; }
  .lbtn.siren:hover { background: #3a0000; }
</style>
</head>
<body>

<header>
  <h1>🚨 Siren Detector</h1>
  <span id="status">disconnected</span>
</header>

<div class="score-panel">
  <div class="score-label">Siren probability</div>
  <div class="score-bar-wrap">
    <div class="score-bar" id="score-bar"></div>
    <span class="score-value" id="score-value">—</span>
  </div>
  <span class="state-badge" id="state-badge">idle</span>
  <div class="score-breakdown" id="score-breakdown"></div>
</div>

<div class="events-header">
  <span>Events <span class="events-count" id="events-count"></span></span>
  <span style="display:flex;gap:6px;align-items:center">
    <label style="font-size:11px;color:#666;cursor:pointer"><input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)"> Select all</label>
    <button onclick="clearEvents()">Clear</button>
  </span>
</div>
<div class="batch-bar" id="batch-bar">
  <span id="selected-count">0</span><span>selected:</span>
  <button class="lbtn" onclick="batchLabel('siren')">siren</button>
  <button class="lbtn" onclick="batchLabel('background')">background</button>
  <button class="lbtn" onclick="batchLabel('motorcycle')">motorcycle</button>
  <button class="lbtn" onclick="batchLabel('unknown')">unknown</button>
</div>
<div class="filter-bar">
  <button class="fbtn active" data-filter="siren" onclick="setFilter(this)">siren</button>
  <button class="fbtn" data-filter="background" onclick="setFilter(this)">background</button>
  <button class="fbtn" data-filter="motorcycle" onclick="setFilter(this)">motorcycle</button>
  <button class="fbtn" data-filter="unknown" onclick="setFilter(this)">unknown</button>
  <button class="fbtn" data-filter="all" onclick="setFilter(this)">all</button>
</div>
<div id="events"><div class="empty" id="empty">No events yet</div></div>

<script>
const scoreBar   = document.getElementById('score-bar');
const scoreValue = document.getElementById('score-value');
const stateBadge = document.getElementById('state-badge');
const statusEl   = document.getElementById('status');
const eventsEl   = document.getElementById('events');
let   emptyEl    = document.getElementById('empty');
let   currentAudio = null;
const seenEvents = new Set();

function setScore(score, state, yamnet, mlp, top) {
  const pct = Math.min(score * 100, 100);
  const color = score >= 0.3 ? '#ef5350' : score >= 0.10 ? '#ffa726' : '#4caf50';
  scoreBar.style.width      = pct + '%';
  scoreBar.style.background = color;
  scoreValue.textContent    = (score * 100).toFixed(1) + '%';
  stateBadge.textContent    = state;
  stateBadge.className      = 'state-badge ' + state;
  scoreBar.classList.toggle('pulsing', state === 'possible' || state === 'confirmed');
  const parts = [];
  if (top)         parts.push(`top: ${top}`);
  if (yamnet != null) parts.push(`yamnet: ${(yamnet * 100).toFixed(0)}%`);
  if (mlp != null)    parts.push(`mlp: ${(mlp * 100).toFixed(0)}%`);
  document.getElementById('score-breakdown').textContent = parts.join('  ·  ');
}

function addEvent(ev) {
  if (!ev.clip_url) return;  // show only confirmed events with audio
  const eventKey = `${ev.timestamp}:${ev.clip_url}`;
  if (seenEvents.has(eventKey)) return;
  seenEvents.add(eventKey);
  if (emptyEl) { emptyEl.remove(); emptyEl = null; }
  const ts = new Date(ev.timestamp).toLocaleTimeString();
  const filename = ev.clip_url.split('/').pop();
  const card = document.createElement('div');
  card.className = 'event-card';
  const breakdown = (() => {
    const p = [];
    if (ev.yamnet_top) p.push(`top: ${ev.yamnet_top}`);
    if (ev.yamnet != null) p.push(`yamnet: ${(ev.yamnet * 100).toFixed(0)}%`);
    if (ev.mlp != null)    p.push(`mlp: ${(ev.mlp * 100).toFixed(0)}%`);
    return p.join('  ·  ');
  })();
  card.dataset.filename = filename;
  card.innerHTML = `
    <div class="event-meta">
      <input type="checkbox" class="ev-check" onchange="updateSelection()">
      <span class="badge confirmed">${ev.event.toUpperCase()}</span>
      <span class="event-time">${ts}</span>
      <span class="event-conf">${(ev.confidence * 100).toFixed(1)}%</span>
      <span class="event-engine">${ev.engine}</span>
    </div>
    ${breakdown ? `<div class="event-breakdown">${breakdown}</div>` : ''}
    <audio controls src="${ev.clip_url}"></audio>
    <div class="label-row">
      <span>Label:</span>
      ${['siren','background','motorcycle','unknown'].map(l =>
        `<button class="lbtn" data-label="${l}" onclick="sendLabel(this,'${filename}','${l}')">${l}</button>`
      ).join('')}
    </div>
  `;
  eventsEl.insertBefore(card, eventsEl.firstChild);
  if (ev.label) {
    applyCardLabel(card, ev.label);
  } else {
    // model prediction — show card but don't highlight any label button
    card.dataset.label = ev.event;
    card.style.display = (activeFilter === 'all' || ev.event === activeFilter) ? '' : 'none';
  }
  card.querySelector('audio').addEventListener('play', function() {
    if (currentAudio && currentAudio !== this) { currentAudio.pause(); currentAudio.currentTime = 0; }
    currentAudio = this;
  });
  updateEventsCount();
}

const LABEL_COLORS = {
  siren:      { border: '#5a1a1a', bg: '#2a0a0a', text: '#ef5350' },
  background: { border: '#1a3a2a', bg: '#0a1a10', text: '#4caf50' },
  motorcycle: { border: '#2a2a00', bg: '#1a1a00', text: '#ffd54f' },
  explosion:  { border: '#3a1a00', bg: '#1a0a00', text: '#ff7043' },
  unknown:    { border: '#2a2a2a', bg: '#1a1a1a', text: '#888'    },
};

let activeFilter = 'siren';

function setFilter(btn) {
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  document.querySelectorAll('#events .event-card').forEach(card => {
    const lbl = card.dataset.label;
    card.style.display = (activeFilter === 'all' || lbl === activeFilter) ? '' : 'none';
    const cb = card.querySelector('.ev-check');
    if (cb) cb.checked = false;
  });
  document.getElementById('select-all').checked = false;
  updateSelection();
}

function applyCardLabel(card, label) {
  const prevLabel = card.dataset.label;
  card.dataset.label = label;
  const c = LABEL_COLORS[label] || LABEL_COLORS.unknown;
  card.style.borderColor = c.border;
  card.style.background  = c.bg;
  const row = card.querySelector('.label-row');
  if (row) {
    row.querySelectorAll('.lbtn').forEach(b => {
      b.classList.toggle('active', b.dataset.label === label);
      b.textContent = (b.dataset.label === label ? '✓ ' : '') + b.dataset.label;
    });
    if (prevLabel && prevLabel !== label) {
      const span = row.querySelector('span');
      span.textContent = '✓ saved:';
      span.style.color = c.text;
    }
  }
  const visible = (activeFilter === 'all' || label === activeFilter);
  card.style.display = visible ? '' : 'none';
  if (!visible) {
    const audio = card.querySelector('audio');
    if (audio && !audio.paused) { audio.pause(); audio.currentTime = 0; }
  }
}

async function sendLabel(btn, filename, label) {
  const card = btn.closest('.event-card');
  const res = await fetch('/feedback', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({filename, label}),
  });
  if (res.ok) applyCardLabel(card, label);
}

function updateEventsCount() {
  const total = eventsEl.querySelectorAll('.event-card').length;
  document.getElementById('events-count').textContent = total ? `(${total})` : '';
}

function updateSelection() {
  const visible = [...eventsEl.querySelectorAll('.event-card')].filter(c => c.style.display !== 'none');
  const checked = visible.filter(c => c.querySelector('.ev-check')?.checked);
  const count = checked.length;
  document.getElementById('selected-count').textContent = count;
  const bar = document.getElementById('batch-bar');
  bar.classList.toggle('visible', count > 0);
  const selectAll = document.getElementById('select-all');
  selectAll.checked = visible.length > 0 && count === visible.length;
  selectAll.indeterminate = count > 0 && count < visible.length;
}

function toggleSelectAll(checked) {
  eventsEl.querySelectorAll('.event-card').forEach(card => {
    if (card.style.display !== 'none') {
      const cb = card.querySelector('.ev-check');
      if (cb) cb.checked = checked;
    }
  });
  updateSelection();
}

async function batchLabel(label) {
  const cards = [...eventsEl.querySelectorAll('.event-card')].filter(c =>
    c.style.display !== 'none' && c.querySelector('.ev-check')?.checked
  );
  for (const card of cards) {
    const filename = card.dataset.filename;
    const res = await fetch('/feedback', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({filename, label}),
    });
    if (res.ok) {
      applyCardLabel(card, label);
      card.querySelector('.ev-check').checked = false;
    }
  }
  updateSelection();
}

function clearEvents() {
  eventsEl.innerHTML = '<div class="empty" id="empty">No events yet</div>';
  emptyEl = document.getElementById('empty');
  document.getElementById('select-all').checked = false;
  updateSelection();
  updateEventsCount();
}

function connect() {
  const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${wsProtocol}//${location.host}/ws`);
  ws.onopen  = () => { statusEl.textContent = 'connected'; statusEl.className = 'connected'; };
  ws.onclose = () => { statusEl.textContent = 'reconnecting…'; statusEl.className = ''; setTimeout(connect, 2000); };
  ws.onmessage = ({ data }) => {
    const msg = JSON.parse(data);
    if (msg.type === 'score') setScore(msg.score, msg.state, msg.yamnet, msg.mlp, msg.top);
    if (msg.type === 'event') addEvent(msg);
  };
}
connect();
</script>
</body>
</html>
