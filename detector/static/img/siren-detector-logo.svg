<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>siren-detector</title>
  <defs>
    <!-- Head silhouette used to cut gaps in the inner arc -->
    <g id="head">
      <path d="M522,476 V432 Q522,412 542,412 H610 V398 Q610,388 620,388 H632 Q642,388 642,398 V412 H708 Q728,412 728,432 V476 Z"/>
      <rect x="522" y="495" width="206" height="227"/>
      <polygon points="392,495 522,532 522,680 392,718"/>
      <polygon points="288,462 372,488 372,727 288,750"/>
      <polygon points="746,527 860,493 860,718 746,685"/>
      <polygon points="880,488 966,462 966,750 880,724"/>
    </g>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254">
      <rect width="1254" height="1254" fill="#fff"/>
      <use href="#head" fill="#000" stroke="#000" stroke-width="60" stroke-linejoin="miter"/>
    </mask>
  </defs>

  <!-- Signal arcs -->
  <g fill="none" stroke="#F7291A" stroke-linecap="butt">
    <path d="M413,1007 A457,457 0 1 1 837,1007" stroke-width="60"/>
    <path d="M471,900 A335,335 0 1 1 779,900" stroke-width="57" mask="url(#cut)"/>
  </g>

  <!-- Hammer -->
  <g fill="#161E27" stroke="#161E27" stroke-width="8" stroke-linejoin="round">
    <use href="#head"/>
    <rect x="543" y="740" width="165" height="50" rx="10"/>
    <polygon points="580,790 668,790 682,1105 568,1105"/>
  </g>
</svg>
