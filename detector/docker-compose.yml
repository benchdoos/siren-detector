services:
  detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siren-detector-engine
    restart: unless-stopped
    network_mode: host
    volumes:
      - tfhub_cache:/root/.cache/tfhub_modules
    command:
      - --bind
      - 127.0.0.1
      - --port
      - "9002"
      - --source
      - siren-detector-01

volumes:
  tfhub_cache:
