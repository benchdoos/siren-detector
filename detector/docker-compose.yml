services:
  detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siren-detector-engine
    restart: unless-stopped
    network_mode: host
    volumes:
      - tfhub_cache:/root/.cache/tfhub_modules
      - ../ml/results:/models:ro
      - clips:/clips
    command:
      - --bind
      - 127.0.0.1
      - --port
      - "${DETECTOR_PORT:-9002}"
      - --source
      - siren-detector-01
      - --classifier-weights
      - /models/classifier_weights.npz
      - --classifier-labels
      - /models/classifier_labels.json

volumes:
  tfhub_cache:
  clips:
