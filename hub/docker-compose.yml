# Persistent services: hub receives audio from ESP32 and fans out to detector.
# Recorder is a separate on-demand service (see recorder/docker-compose.yml).
#
# ESP32 → UDP:${HUB_PORT} → hub → detector(:${DETECTOR_PORT})
#                              └──> recorder(:${RECORDER_PORT})  ← started separately

services:
  hub:
    image: ghcr.io/benchdoos/siren-detector-hub:${IMAGE_TAG:-latest}
    container_name: siren-hub
    restart: unless-stopped
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - --bind
      - 0.0.0.0
      - --port
      - "${HUB_PORT:-9000}"
      - --forward
      - "127.0.0.1:${RECORDER_PORT:-9001}"
      - --forward
      - "127.0.0.1:${DETECTOR_PORT:-9002}"

  detector:
    image: ghcr.io/benchdoos/siren-detector-engine:${IMAGE_TAG:-latest}
    container_name: siren-detector-engine
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TFHUB_CACHE_DIR=/tfhub_cache
      - MQTT_HOST=${MQTT_HOST:-}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_SESSION_SECRET=${OIDC_SESSION_SECRET:-}
      - OIDC_ROLE_CLAIM=${OIDC_ROLE_CLAIM:-roles}
      - OIDC_ROLE_MAP=${OIDC_ROLE_MAP:-viewer=viewer,editor=editor,admin=admin}
      - OIDC_COOKIE_SECURE=${OIDC_COOKIE_SECURE:-true}
    volumes:
      - tfhub_cache:/tfhub_cache
      - ../ml/results:/models:ro
      - ../dataset:/dataset
      - clips:/clips
    command:
      - --bind
      - 127.0.0.1
      - --port
      - "${DETECTOR_PORT:-9002}"
      - --source
      - siren-detector-01
      - --source-name
      - "1=rpi-usb"
      - --classifier-weights
      - /models/classifier_weights.npz
      - --classifier-labels
      - /models/classifier_labels.json
      - --dsp-model
      - /models/dsp_classifier_f32.tflite
      - --dsp-norm-stats
      - /models/dsp_norm_stats.npz
      - --dsp-labels
      - /models/dsp_classifier_labels.json

volumes:
  tfhub_cache:
  clips:
