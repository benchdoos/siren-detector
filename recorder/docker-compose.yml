services:
  recorder:
    build:
      context: ./recorder-files
      dockerfile: Dockerfile
    container_name: siren-audio-recorder
    network_mode: host
    volumes:
      - ../dataset/recorder:/recordings
    command:
      - --bind
      - 127.0.0.1
      - --port
      - "9001"
      - --output-dir
      - /recordings
      - --label
      - ${LABEL:-inbox}
      - --duration
      - ${DURATION:-0}
