services:
  recorder:
    image: ghcr.io/benchdoos/siren-audio-recorder:${IMAGE_TAG:-latest}
    container_name: siren-audio-recorder
    network_mode: host
    volumes:
      - ../dataset/recorder:/recordings
    command:
      - --bind
      - 127.0.0.1
      - --port
      - "${RECORDER_PORT:-9001}"
      - --output-dir
      - /recordings
      - --label
      - ${LABEL:-inbox}
      - --duration
      - ${DURATION:-0}
